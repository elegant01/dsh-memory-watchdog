name: Backfill Release

# 一次性补建 Release：本地 HTTPS 出境被封（SSH 只能推代码），v0.11.0 的 tag
# 已推而 Release 对象建不出来。这个 workflow 借 runner 的网络，仅在
# 「package.json 版本对应的 tag 已存在、而该 tag 还没有 Release」时补建并挂上
# npm pack 的 tarball；其余情况一律不动，可安全重复跑。
#
# 补建成功后推送 ci-release-ok-<tag> 标记 tag，供本地用 git ls-remote 确认，
# 因为本机没有任何通道能查 GitHub API。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve version and tag
        id: v
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "no tag $tag yet — nothing to backfill"
          fi
      - name: Create Release when missing
        if: steps.v.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — skip create"
          else
            gh release create "$tag" --title "$tag" --generate-notes
            echo "created Release $tag"
          fi
      - name: Attach tarball when missing
        if: steps.v.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -q '\.tgz$'; then
            echo "tarball already attached — skip pack"
            exit 0
          fi
          # 按 tag 的内容打包，确保与 Release 指向的 commit 逐字节一致
          git checkout --detach "refs/tags/$tag"
          npm pack
          gh release upload "$tag" ./*.tgz --clobber
          echo "attached $(ls ./*.tgz)"
      - name: Mark backfill done
        if: steps.v.outputs.tagged == 'true'
        run: |
          tag="${{ steps.v.outputs.tag }}"
          marker="ci-release-ok-$tag"
          if git rev-parse -q --verify "refs/tags/$marker" >/dev/null; then
            echo "marker $marker already present"
            exit 0
          fi
          git tag "$marker"
          git push origin "refs/tags/$marker"
